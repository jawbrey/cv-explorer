# Builds installers for Linux, macOS (Apple Silicon + Intel) and Windows on every push and pull
# request, and keeps them as downloadable workflow artifacts (Actions run page -> Artifacts).
# Nothing is published; use release.yml (push a tag like v0.1.0) to publish a release.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple Silicon), platform: macos-latest, args: '--target aarch64-apple-darwin' }
          - { name: macOS (Intel), platform: macos-latest, args: '--target x86_64-apple-darwin' }
          - { name: Linux, platform: ubuntu-22.04, args: '' }
          - { name: Windows, platform: windows-latest, args: '' }
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      # No tagName / releaseName / releaseId => build only, nothing is uploaded to a release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
