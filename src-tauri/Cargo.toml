[package]
name = "cv-explorer"
version = "0.1.0"
edition = "2021"

[lib]
name = "cv_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
